[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_KEYS = "PORT,NODE_ENV,ADMIN_EMAIL,ADMIN_PASSWORD,USER_PASSWORD,PASSWORD_SALT,JWT_SECRET"
  SECRETS_SCAN_OMIT_PATHS = "README.md,docs/**,.env.example,package-lock.json"

# Handle API routes via Netlify Serverless Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Handle Single Page Application client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
